<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());
(function(){var send=function(n,p){try{gtag("event",n,p||{});}catch(e){}};

var watch=function(){document.querySelectorAll("aicx-side-panel:not([data-ga])").forEach(function(p){p.setAttribute("data-ga","");new MutationObserver(function(m){m.forEach(function(r){var v=p.getAttribute(r.attributeName);if(v)send("panel_change",{panel_setting:r.attributeName,panel_value:v});});}).observe(p,{attributes:true,attributeFilter:["size","surface"]});});};
if(!/docs\.html$/.test(location.pathname)){addEventListener("load",watch);setTimeout(watch,3000);}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>AICX review</title>
<style>

</style></head><body><main><h1>AICX prototype review</h1><p>Enter the passcode you were given to view the prototype.</p>
<form id="f"><label for="p">Passcode</label><input id="p" type="password" autocomplete="current-password" required autofocus aria-describedby="err">
<p class="err" id="err" role="alert"></p><button id="b" type="submit">View the prototype</button></form></main><script>const BASE="/";
try{if(/[?&]notrack\b/.test(location.search))localStorage.setItem("aicx-notrack","1");if(/[?&]track\b/.test(location.search))localStorage.removeItem("aicx-notrack");if(localStorage.getItem("aicx-notrack")){var nt=document.createElement("p");nt.textContent="This browser isn't counted in analytics.";nt.style.cssText="margin:16px 0 0;font-size:14px";document.querySelector("main").append(nt)}}catch(e){}
const q=new URLSearchParams(location.search);const next=q.get("next")||"app/index.html?page=docs&batch=first";
const go=()=>location.replace(next.startsWith(BASE)?next:BASE+next.replace(/^\//,""));
async function hasKey(){try{if(!navigator.serviceWorker.controller)return false;const r=await fetch(BASE+"app/__unlocked",{cache:"no-store"});return r.ok}catch{return false}}
(async()=>{if("serviceWorker" in navigator){await navigator.serviceWorker.register(BASE+"sw.js",{scope:BASE});if(await hasKey())go()}})();
document.getElementById("f").addEventListener("submit",async(e)=>{e.preventDefault();const b=document.getElementById("b"),err=document.getElementById("err");
b.disabled=true;b.textContent="Checking…";err.textContent="";
try{const cfg=await (await fetch(BASE+"config.json",{cache:"no-store"})).json();const te=new TextEncoder();
const m=await crypto.subtle.importKey("raw",te.encode(document.getElementById("p").value),"PBKDF2",false,["deriveKey"]);
const salt=new Uint8Array(cfg.salt.match(/../g).map(h=>parseInt(h,16)));
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:cfg.iterations,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["decrypt"]);
const buf=await (await fetch(BASE+"c/check",{cache:"no-store"})).arrayBuffer();
await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));
const reg=await navigator.serviceWorker.ready;
await new Promise((res)=>{const ch=new MessageChannel();ch.port1.onmessage=()=>res();reg.active.postMessage({key},[ch.port2])});
go()}catch(x){err.textContent="That passcode didn't work. Check it and try again.";b.disabled=false;b.textContent="View the prototype";document.getElementById("p").select()}});</script></body></html>
